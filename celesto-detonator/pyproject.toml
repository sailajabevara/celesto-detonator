[project]
name = "detonator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "psycopg[binary]"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
detonator = ["guest_shim.py"]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
